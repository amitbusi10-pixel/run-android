name: Build Android app

on:
  push:
    branches: [main]
    paths-ignore: ['.github/workflows/smoke.yml', 'README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create the Android project
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Build
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.p12
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.p12 --ks-type PKCS12 --ks-pass env:KEYSTORE_PASS --out al-haderech.apk aligned.apk
          "$BT/apksigner" verify --print-certs al-haderech.apk
          rm release.p12

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" al-haderech.apk \
            --title "על הדרך 1.${{ github.run_number }}" \
            --notes "קובץ ההתקנה לאנדרואיד. המסכים נטענים מהאתר, אז עדכונים רגילים מגיעים בלי להתקין מחדש." \
            --latest
