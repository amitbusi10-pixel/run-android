name: Smoke test on emulator

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@v4

      - name: Download the latest APK
        run: curl -sSL -o app.apk https://github.com/${{ github.repository }}/releases/latest/download/al-haderech.apk

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: |
            *.png
            *.txt
