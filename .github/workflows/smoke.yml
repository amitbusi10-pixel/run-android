name: Smoke test on emulator

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # latest = the current app; v6 = an old install (before the native service), which still gets the web updates
        apk: [latest, v25]
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@v4

      - name: Download the APK
        run: |
          if [ "${{ matrix.apk }}" = latest ]; then curl -sSL -o app.apk https://github.com/${{ github.repository }}/releases/latest/download/al-haderech.apk
          else curl -sSL -o app.apk https://github.com/${{ github.repository }}/releases/download/${{ matrix.apk }}/al-haderech.apk; fi

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: OLD=${{ matrix.apk != 'latest' && '1' || '' }} bash scripts/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.apk }}
          path: |
            *.png
            *.txt
            *.xml
