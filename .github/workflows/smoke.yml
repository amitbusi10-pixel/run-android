name: Smoke test on emulator

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download the latest APK
        run: curl -sSL -o app.apk https://github.com/${{ github.repository }}/releases/latest/download/al-haderech.apk

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app.apk
            adb shell pm grant app.alhaderech.run android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant app.alhaderech.run android.permission.POST_NOTIFICATIONS || true
            adb logcat -c
            adb shell monkey -p app.alhaderech.run -c android.intent.category.LAUNCHER 1
            sleep 40
            adb exec-out screencap -p > screen.png
            adb logcat -d | grep -E "Capacitor|AL-HADERECH|chromium|AndroidRuntime" | tail -80 > log.txt || true
            cat log.txt
            grep -q "AL-HADERECH native ok" log.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: |
            screen.png
            log.txt
